[build]
  command = "npm run build"
  publish = "dist"

# www → non-www canonical redirect (301)
[[redirects]]
  from = "https://www.walkstudios.com/*"
  to = "https://walkstudios.com/:splat"
  status = 301
  force = true

# Netlify Forms success redirect
[[redirects]]
  from = "/contact"
  to = "/contact?success=true"
  status = 200
  conditions = {Method = ["POST"]}
